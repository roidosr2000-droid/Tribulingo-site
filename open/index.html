<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tribulingo para Android</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #FAF6EE;
      color: #272A26;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #FFFDF8;
      border: 1px solid #E9E1D6;
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(39, 42, 38, 0.08);
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 26px;
      background: #D8ECE7;
      overflow: hidden;
    }

    .logo img {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 30px;
      line-height: 1.2;
    }

    .button {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border: none;
      border-radius: 15px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      background: #2F746B;
      color: white;
      cursor: pointer;
    }

    .button:hover {
      background: #255F58;
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #7A817A;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      <img
        src="../tribulingo_llama.png"
        alt="Tribulingo llama"
      >
    </div>

    <h1>Tribulingo para Android</h1>

    <button
      class="button"
      type="button"
      onclick="openGooglePlay()"
    >
      Actualizar / Descargar en Google Play
    </button>

    <div class="note">
      Tribulingo · Lenguas originarias
    </div>

  </main>

  <script>
    function openGooglePlay() {
      const packageName = 'com.tribulingo.app';

      const webUrl =
        'https://play.google.com/store/apps/details?id=' + packageName;

      const isAndroid =
        /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        const intentUrl =
          'intent://details?id=' + packageName +
          '#Intent;' +
          'scheme=market;' +
          'package=com.android.vending;' +
          'S.browser_fallback_url=' +
          encodeURIComponent(webUrl) +
          ';end';

        window.location.href = intentUrl;
      } else {
        window.location.href = webUrl;
      }
    }
  </script>

</body>
</html>
